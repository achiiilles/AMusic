name: pally-tmp-ytm-probe
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.github/workflows/pally-tmp-ytm-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          KEY = "AIzaSyC9XL3ZjWddXya6X74dJoCTL-WEYFDNX30"
          def call(ep, body, hl):
              ctx = {"client": {"clientName": "WEB_REMIX", "clientVersion": "1.20250210.01.00", "hl": hl, "gl": "BR"}}
              body = dict(body); body["context"] = ctx
              req = urllib.request.Request("https://music.youtube.com/youtubei/v1/%s?key=%s&prettyPrint=false" % (ep, KEY), data=json.dumps(body).encode(), headers={"Content-Type": "application/json", "Origin": "https://music.youtube.com", "User-Agent": "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0", "Accept-Language": hl})
              return json.load(urllib.request.urlopen(req, timeout=30))
          def walk(o, key, out):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k == key: out.append(v)
                      else: walk(v, key, out)
              elif isinstance(o, list):
                  for v in o: walk(v, key, out)
          def runs(c):
              r = c.get("text", {}).get("runs", [])
              return "".join(x.get("text", "") for x in r)
          PUB = re.compile(r"(?:tocou\s+)?([\d][\d., ]*?)\s*(k|m|b|mi|mil|bi|thousand|millions?|billions?|milh(?:ão|ões|ao|oes)|bilh(?:ão|ões|ao|oes))?\s*(?:plays?|views?|vezes|reproduç(?:ão|ões)|reproduc(?:ao|oes)|visualizaç(?:ão|ões)|visualizac(?:ao|oes))", re.I)
          def parse(t):
              v = t.replace("\u00a0", " ").replace("\u202f", " ").strip()
              m = PUB.fullmatch(v)
              return None if not m else (m.group(1), m.group(2))
          def album(browse, hl, label):
              d = call("browse", {"browseId": browse}, hl)
              rows = []
              walk(d, "musicResponsiveListItemRenderer", rows)
              print("==== %s hl=%s browse=%s rows=%d" % (label, hl, browse, len(rows)))
              for i, r in enumerate(rows):
                  vid = (r.get("playlistItemData") or {}).get("videoId")
                  flex = [runs(c.get("musicResponsiveListItemFlexColumnRenderer", {})) for c in r.get("flexColumns", [])]
                  fixed = [runs(c.get("musicResponsiveListItemFixedColumnRenderer", {})) for c in r.get("fixedColumns", [])]
                  flexparts = [p for f in flex[1:] for p in re.split(r" [•·] ", f)]
                  parsed = [parse(p) for p in flexparts if parse(p)] or [parse(f) for f in fixed if parse(f)]
                  print("%d vid=%s flex=%s fixed=%s parsed=%s" % (i + 1, vid, flex, fixed, parsed[:1]))
              return d
          def find_album(q, hl):
              d = call("search", {"query": q, "params": "EgWKAQIYAWoKEAkQChAFEAMQBA=="}, hl)
              items = []
              walk(d, "musicResponsiveListItemRenderer", items)
              for it in items[:4]:
                  bid = it.get("navigationEndpoint", {}).get("browseEndpoint", {}).get("browseId")
                  fl = [runs(c.get("musicResponsiveListItemFlexColumnRenderer", {})) for c in it.get("flexColumns", [])]
                  print("search", q, "->", bid, fl)
              for it in items:
                  bid = it.get("navigationEndpoint", {}).get("browseEndpoint", {}).get("browseId")
                  if bid: return bid
          for hl in ["pt-BR", "en"]:
              for q in ["LUNA Free Somebody The 1st Mini Album", "Billie Eilish Happier Than Ever", "Dua Lipa Future Nostalgia", "Harry Styles Fine Line"]:
                  try:
                      b = find_album(q, hl)
                      if b: album(b, hl, q)
                  except Exception as e:
                      print("ERR", hl, q, repr(e))
          PY
