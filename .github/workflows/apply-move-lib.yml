name: apply-move-lib
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/apply-move-lib.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: patch
        run: |
          python3 - <<'PY'
          import sys
          F = 'app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt'
          s = open(F, encoding='utf-8').read()
          I = ' ' * 12
          old = '\n'.join([
              I + 'if (isArtist && libraryArtist != null && onLibraryArtistClick != null) {',
              I + '    item(key = "in-your-library") {',
              I + '        Column(',
              I + '            Modifier',
              I + '                .padding(top = 22.dp)',
              I + '                .clickable(onClick = onLibraryArtistClick),',
              I + '        ) {',
              I + '            SectionHeading(',
              I + '                title = "Na sua biblioteca",',
              I + '                palette = palette,',
              I + '                onShowAll = onLibraryArtistClick,',
              I + '                horizontalPadding = ARTIST_CONTENT_GUTTER,',
              I + '            )',
              I + '        }',
              I + '    }',
              I + '}',
          ]) + '\n\n'
          anchor = I + '// The first release on the shelves below, pulled out as a card of its own.\n'
          if s.count(old) != 1:
              sys.exit('old block found %d times' % s.count(old))
          if s.count(anchor) != 1:
              sys.exit('anchor found %d times' % s.count(anchor))
          new = '\n'.join([
              I + '// Na sua biblioteca: only the Ver tudo link opens the page, like the other headings.',
              I + 'if (isArtist && libraryArtist != null && onLibraryArtistClick != null) {',
              I + '    item(key = "in-your-library") {',
              I + '        SectionHeading(',
              I + '            title = "Na sua biblioteca",',
              I + '            palette = palette,',
              I + '            onShowAll = onLibraryArtistClick,',
              I + '            horizontalPadding = ARTIST_CONTENT_GUTTER,',
              I + '        )',
              I + '    }',
              I + '}',
          ]) + '\n\n'
          s = s.replace(old, '')
          s = s.replace(anchor, new + anchor)
          a = s.index('item(key = "actions")')
          b = s.index('item(key = "in-your-library")')
          c = s.index('item(key = "top-release")')
          if not (a < b < c):
              sys.exit('order wrong %d %d %d' % (a, b, c))
          if s.count('item(key = "in-your-library")') != 1:
              sys.exit('duplicate in-your-library item')
          open(F, 'w', encoding='utf-8').write(s)
          PY
      - name: push
        run: |
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -A
          git commit -m "Library: move Na sua biblioteca above the latest release, only Ver tudo opens it [skip ci]"
          git push origin HEAD:library-artists-merge
