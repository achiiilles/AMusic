name: pally-popular3
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pally-popular3
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Apply only the anchored edits, no compilation
        run: |
          python3 .github/scripts/pally_popular3_data.py
          python3 .github/scripts/pally_popular3_ui.py
          git diff --check
          git diff --stat
      - name: Commit only the five changed app files
        run: |
          git config user.name "pally"
          git config user.email "pally@users.noreply.github.com"
          git add shared/src/commonMain/kotlin/com/music/amusic/data/model/Models.kt shared/src/jvmSharedMain/kotlin/com/music/amusic/data/innertube/InnertubeParser.kt shared/src/jvmSharedMain/kotlin/com/music/amusic/data/YtMusicRepository.kt sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/components/Common.kt app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat: pontinho nas 3 faixas mais tocadas do álbum pelo YT Music [skip ci]"
          git pull --rebase origin polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
