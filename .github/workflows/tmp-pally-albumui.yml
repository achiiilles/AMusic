name: tmp-pally-albumui
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-albumui']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Aplicar mudancas da tela de album
        run: python3 .pally/patch_albumui.py
      - name: Salvar
        run: |
          git config user.name pally-bot
          git config user.email pally-bot@users.noreply.github.com
          git add app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/components/Common.kt
          git commit -m "Tela de album e single: descricao sem titulo com MAIS no fim da segunda linha, faixas sem duracao e artista so quando difere do artista do album [skip ci]"
          git push
