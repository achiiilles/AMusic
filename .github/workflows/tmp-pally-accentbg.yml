name: tmp-pally-accentbg
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-accentbg']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply patch
        run: python3 .pally/patch_accentbg.py
      - name: Commit
        run: |
          git config user.name "pally-bot"
          git config user.email "pally-bot@users.noreply.github.com"
          git add sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/theme/ArtworkPalette.kt app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt app/src/main/java/com/music/amusic/MainActivity.kt
          git commit -m "Album e single: fundo neutro passa a usar a cor de destaque da capa [skip ci]"
          git push origin HEAD:polish-refresh-transitions
