name: scan-temp5
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/scan-temp5.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: scan
        run: |
          mkdir -p scan-out
          D=app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          M=app/src/main/java/com/music/amusic/MainActivity.kt
          P=shared/src/jvmSharedMain/kotlin/com/music/amusic/data/innertube/InnertubeParser.kt
          { echo '== Main 2975-3015'; sed -n 2975,3015p $M; echo '== Main 3075-3110'; sed -n 3075,3110p $M; echo '== Main grep'; grep -nE 'onActiveShelfChange|activeShelf|openDetail\(|detailStack|BrowseType\.ARTIST' $M | head -40; } | cut -c1-200 > scan-out/s5.txt
          { echo '== Parser grep'; grep -nE 'fun parse(Artist|Detail|Browse|Sections|Carousel|Shelf)|sections *=|musicCarouselShelfRenderer|musicShelfRenderer|isOwnLibrary|fromLibrary' $P | head -40; echo '== Detail grep'; grep -nE 'onActiveShelfChange|activeShelf|topRelease' $D | head -20; echo '== Models grep'; grep -nE 'data class (DetailPage|BrowsePage|HomeShelf|ShelfItem)|enum class BrowseType' -A8 shared/src/commonMain/kotlin/com/music/amusic/data/model/Models.kt | head -60; } | cut -c1-200 > scan-out/s6.txt
      - name: push
        run: |
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -A
          git commit -m "scan report 4 [skip ci]" || exit 0
          git push origin HEAD:library-artists-merge
