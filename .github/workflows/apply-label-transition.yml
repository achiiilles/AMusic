name: Apply Ver tudo label transition patch
on:
  push:
    branches: [library-artists-merge]
    paths:
      - '.github/workflows/apply-label-transition.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: Patch DetailScreen only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt')
          s = p.read_text(encoding='utf-8')
          imp = 'import androidx.compose.animation.togetherWith\n'
          assert s.count(imp) == 1, 'togetherWith import changed'
          assert 'animation.slideInVertically' not in s and 'animation.slideOutVertically' not in s and 'animation.SizeTransform' not in s, 'imports already present'
          s = s.replace(imp, imp + 'import androidx.compose.animation.SizeTransform\nimport androidx.compose.animation.slideInVertically\nimport androidx.compose.animation.slideOutVertically\n', 1)
          old = '''        if (onShowAll != null) {
                      Text(
                          text = showAllText ?: stringResource(R.string.show_all),
                          style = MaterialTheme.typography.titleSmall,
                          color = palette.accent,
                          modifier = Modifier
                              .clickable(onClick = onShowAll)
                              .padding(start = 12.dp, top = 4.dp, bottom = 4.dp),
                      )
                  }
          '''
          new = '''        if (onShowAll != null) {
                      // Ver tudo and Ver menos trade places with the same 400 ms curve the
                      // songs block uses: the old label fades up and out while the new
                      // one fades in from just below.
                      AnimatedContent(
                          targetState = showAllText ?: stringResource(R.string.show_all),
                          transitionSpec = {
                              (
                                  fadeIn(animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing)) +
                                      slideInVertically(
                                          animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing),
                                          initialOffsetY = { fullHeight -> fullHeight / 2 },
                                      )
                                  ) togetherWith (
                                  fadeOut(animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing)) +
                                      slideOutVertically(
                                          animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing),
                                          targetOffsetY = { fullHeight -> -fullHeight / 2 },
                                      )
                                  ) using SizeTransform(clip = true) { _, _ ->
                                  tween(durationMillis = 400, easing = FastOutSlowInEasing)
                              }
                          },
                          label = "show_all_label",
                          modifier = Modifier
                              .clickable(onClick = onShowAll)
                              .padding(start = 12.dp, top = 4.dp, bottom = 4.dp),
                      ) { label ->
                          Text(
                              text = label,
                              style = MaterialTheme.typography.titleSmall,
                              color = palette.accent,
                          )
                      }
                  }
          '''
          assert s.count(old) == 1, 'section heading label changed'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -- app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "Animate Ver tudo / Ver menos label swap [skip ci]"
          git push origin HEAD:library-artists-merge
