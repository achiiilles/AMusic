name: tmp-pally-explicit-badge

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Inventario do selo E
        run: |
          set -e
          grep -rni "explicit" --include=*.kt app sharedUi | head -n 300 > tmp-badge-report.txt || true
          wc -l tmp-badge-report.txt
          git config user.name pally
          git config user.email pally@users.noreply.github.com
          git add tmp-badge-report.txt
          git commit -m "Temporario: inventario do selo E [skip ci]" || echo "nothing to commit"
          git push origin HEAD:polish-refresh-transitions || true
      - name: Patch
        run: |
          set -e
          cat > /tmp/patch.py <<'PY'
          import io, sys

          def read(p):
              with io.open(p, encoding='utf-8') as f:
                  return f.read()

          def write(p, s):
              with io.open(p, 'w', encoding='utf-8') as f:
                  f.write(s)

          def once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  sys.exit('anchor %s matched %d time(s)' % (label, n))
              return s.replace(old, new, 1)

          pc = 'sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/player/PlayerControls.kt'
          s = read(pc)
          s = once(s,
              '    leading: (@Composable () -> Unit)? = null,\n    onOverflowChange: (Boolean) -> Unit = {},\n',
              '    leading: (@Composable () -> Unit)? = null,\n    /** Drawn after the line, so a badge can ride at the end of the name. */\n    trailing: (@Composable () -> Unit)? = null,\n    onOverflowChange: (Boolean) -> Unit = {},\n',
              'signature')
          s = once(s,
              '                modifier = Modifier.weight(1f, fill = false),\n            )\n            return@Row\n',
              '                modifier = Modifier.weight(1f, fill = false),\n            )\n            if (trailing != null) {\n                Spacer(Modifier.width(6.dp))\n                trailing()\n            }\n            return@Row\n',
              'plain-branch')
          s = once(s,
              '                MarqueeLine(text = text, style = style, color = color)\n                if (overflowing) {\n                    Spacer(Modifier.width(MARQUEE_GAP))\n                    MarqueeLine(text = text, style = style, color = color)\n                }\n            }\n        }\n    }\n}\n',
              '                MarqueeLine(text = text, style = style, color = color)\n                if (overflowing) {\n                    Spacer(Modifier.width(MARQUEE_GAP))\n                    MarqueeLine(text = text, style = style, color = color)\n                }\n            }\n        }\n        if (trailing != null) {\n            Spacer(Modifier.width(6.dp))\n            trailing()\n        }\n    }\n}\n',
              'marquee-tail')
          write(pc, s)

          np = 'sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/player/NowPlayingScreen.kt'
          t = read(np)
          old = 'leading = if (song.isExplicit == true)'
          n = t.count(old)
          if n != 1:
              sys.exit('nowplaying anchor matched %d time(s)' % n)
          t = t.replace(old, 'trailing = if (song.isExplicit == true)', 1)
          write(np, t)
          print('patched ok')
          PY
          python3 /tmp/patch.py
          git add -A
          git commit -m "Selo E depois do nome da faixa: MarqueeText ganha um slot trailing e a tela do player passa o E por ele [skip ci]"
          git push origin HEAD:polish-refresh-transitions
          git log --oneline -3
