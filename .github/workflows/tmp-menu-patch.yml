name: Apply Menu Patch

on:
  push:
    branches:
      - polish-refresh-transitions
    paths:
      - '.github/tmp-menu-patch/**'
      - '.github/workflows/tmp-menu-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Patch
        run: |
          python3 .github/tmp-menu-patch/patch.py

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/music/amusic/ui/components/SongActionsSheet.kt
          git add app/src/main/java/com/music/amusic/ui/components/BrowseActionsSheet.kt
          git rm -rf .github/tmp-menu-patch || true
          git rm -f .github/workflows/tmp-menu-patch.yml || true
          git commit -m "Atalhos de toque no cabecalho dos menus de contexto [skip ci]" || echo "No changes"
          git push origin HEAD:polish-refresh-transitions
