name: tmp-polish-read2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: ler
        run: bash tmp-polish/read2.sh
      - name: gravar saida
        run: |
          git config user.name tmp-polish
          git config user.email tmp-polish@users.noreply.github.com
          git add tmp-polish/out-read2.txt
          git commit -m "[skip ci] tmp: saida de leitura" || echo sem mudanca
          git push origin HEAD:polish-refresh-transitions
