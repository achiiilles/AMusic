name: Apply spring open patch
on:
  push:
    branches: [library-artists-merge]
    paths:
      - '.github/workflows/apply-spring-open.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: Patch DetailScreen only
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt')
          s = p.read_text(encoding='utf-8')
          tw = r'tween\(durationMillis = 400, easing = FastOutSlowInEasing\)'
          sp = 'spring(dampingRatio = Spring.DampingRatioLowBouncy, stiffness = Spring.StiffnessMedium)'
          pe = re.compile(r'(expandVertically\(\s*animationSpec = )' + tw + r'(,\s*expandFrom = Alignment\.Top,)')
          ps = re.compile(r'(shrinkVertically\(\s*animationSpec = )' + tw + r'(,\s*shrinkTowards = Alignment\.Top,)')
          assert len(pe.findall(s)) == 1, 'expandVertically block changed'
          assert len(ps.findall(s)) == 1, 'shrinkVertically block changed'
          s = pe.sub(lambda m: m.group(1) + sp + m.group(2), s, count=1)
          s = ps.sub(lambda m: m.group(1) + sp + m.group(2), s, count=1)
          imp = 'import androidx.compose.animation.core.FastOutSlowInEasing\n'
          assert s.count(imp) == 1, 'FastOutSlowInEasing import changed'
          assert 'animation.core.spring' not in s and 'animation.core.Spring' not in s, 'spring imports already present'
          s = s.replace(imp, imp + 'import androidx.compose.animation.core.Spring\nimport androidx.compose.animation.core.spring\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -- app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "Use spring for Songs list open and close [skip ci]"
          git push origin HEAD:library-artists-merge
