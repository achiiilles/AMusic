name: tmp-pally-album-buttons
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-album-buttons']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Aplicar somente os botoes do album
        run: |
          cp .pally/patch_album_buttons.py /tmp/patch_album_buttons.py
          python3 /tmp/patch_album_buttons.py
