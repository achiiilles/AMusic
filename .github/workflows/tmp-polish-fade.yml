name: tmp polish fade
on:
  push:
    paths:
      - 'tmp-polish/fade-run.txt'
permissions:
  contents: write
jobs:
  fade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply 180 ms fade and dump context
        run: python3 tmp-polish/patch.py
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt tmp-polish/fade-out.txt
          git commit -m "Fade de 180 ms na troca da lista Ver tudo do artista [skip ci]" || echo nothing to commit
          git push
