name: tmp-polish-footer

on:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - 'tmp-polish/footer-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Read and push
        run: |
          set +e
          bash tmp-polish/footer-read.sh > tmp-polish/out-footer.txt 2>&1
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tmp-polish/out-footer.txt
          git commit -m "tmp: resultado da leitura do rodape [skip ci]"
          git pull --rebase origin polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
