name: apply-move-patch
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/apply-move-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: patch
        run: |
          mkdir -p scan-out
          { grep -rnE 'val detailStack' --include=*.kt app/src/main; grep -nE 'val sections' shared/src/commonMain/kotlin/com/music/amusic/data/model/Models.kt; } | cut -c1-200 > scan-out/s8.txt || true
          python3 - <<'PY'
          import re, sys
          DETAIL = "app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt"
          MAIN = "app/src/main/java/com/music/amusic/MainActivity.kt"
          d = open(DETAIL, encoding="utf-8").read()
          m = open(MAIN, encoding="utf-8").read()
          if "hiddenFromLibraryTitle" in d or "fromLibraryShelfTitle" in m:
              sys.exit("already patched")

          # DetailScreen 1: compute the visible sections right after isArtist
          a1 = "val isArtist = page.type == BrowseType.ARTIST\n"
          if d.count(a1) != 1:
              sys.exit("anchor isArtist found %d times" % d.count(a1))
          add1 = (
              "    // The artist page no longer draws YouTube's own \"From your library\" shelf;\n"
              "    // the same shelf is shown on the library page opened by \"Na sua biblioteca\".\n"
              "    val hiddenFromLibraryTitle = stringResource(R.string.shelf_from_your_library)\n"
              "    val visibleSections = if (isArtist) {\n"
              "        page.sections.filterNot { shelf ->\n"
              "            val shelfTitle = shelf.title.trim()\n"
              "            shelfTitle.equals(hiddenFromLibraryTitle, ignoreCase = true) ||\n"
              "                shelfTitle.equals(\"From your library\", ignoreCase = true)\n"
              "        }\n"
              "    } else {\n"
              "        page.sections\n"
              "    }\n"
          )
          d = d.replace(a1, a1 + add1)

          a2 = "items(page.sections) { shelf ->"
          if d.count(a2) != 1:
              sys.exit("anchor items(page.sections) found %d times" % d.count(a2))
          d = d.replace(a2, "items(visibleSections) { shelf ->")

          # MainActivity: replace the name-filtered album shelf with the artist page's own shelf
          pat = re.compile(r'(?m)^([ ]*)val libraryAlbumsShelf = remember\(.*?HomeShelf\(title = "\u00c1lbuns na sua biblioteca", items = albums\)\s*\n[ ]*\}\n', re.S)
          ms = list(pat.finditer(m))
          if len(ms) != 1:
              sys.exit("libraryAlbumsShelf block found %d times" % len(ms))
          mt = ms[0]
          if len(mt.group(0)) > 2500:
              sys.exit("block too long")
          I = mt.group(1)
          lines = [
              'val fromLibraryShelfTitle = androidx.compose.ui.res.stringResource(R.string.shelf_from_your_library)',
              'val libraryAlbumsShelf = remember(detailStack, page.browseId, page.type, fromLibraryShelfTitle) {',
              '    if (page.type == BrowseType.ARTIST) {',
              '        null',
              '    } else {',
              '        val pageIndex = detailStack.indexOfLast { it.browseId == page.browseId }',
              '        detailStack.getOrNull(pageIndex - 1)',
              '            ?.takeIf { pageIndex > 0 && it.type == BrowseType.ARTIST }',
              '            ?.sections',
              '            ?.firstOrNull { shelf ->',
              '                val shelfTitle = shelf.title.trim()',
              '                shelfTitle.equals(fromLibraryShelfTitle, ignoreCase = true) ||',
              '                    shelfTitle.equals("From your library", ignoreCase = true)',
              '            }',
              '    }',
              '}',
          ]
          new = "".join(I + l + "\n" for l in lines)
          m = m[:mt.start()] + new + m[mt.end():]
          open(DETAIL, "w", encoding="utf-8").write(d)
          open(MAIN, "w", encoding="utf-8").write(m)
          print("patched")
          PY

      - name: push
        run: |
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -A
          git commit -m "Library: move 'Da sua biblioteca' shelf from artist page to the 'Na sua biblioteca' page [skip ci]"
          git push origin HEAD:library-artists-merge
