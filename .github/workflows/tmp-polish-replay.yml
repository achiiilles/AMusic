name: tmp-polish-replay
on:
  push:
    paths:
      - tmp-polish/replay-trigger.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tmp-polish/replay-apply.py > tmp-polish/replay-out.txt 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then git diff -U2 -- app | cut -c1-200 >> tmp-polish/replay-out.txt; fi
          git config user.name tmp-polish
          git config user.email tmp-polish@users.noreply.github.com
          if [ $rc -eq 0 ]; then
            git add app tmp-polish/replay-out.txt
            git commit -m 'feat: artist photos from Apple Music in Replay [skip ci]'
          else
            git add tmp-polish/replay-out.txt
            git commit -m 'tmp-polish: replay apply failed [skip ci]'
          fi
          git push
