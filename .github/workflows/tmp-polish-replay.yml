name: tmp-polish-replay
on:
  push:
    paths:
      - tmp-polish/replay-trigger.txt
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tmp-polish/replay-read.sh
      - run: |
          git config user.name tmp-polish
          git config user.email tmp-polish@users.noreply.github.com
          git add tmp-polish/replay-out.txt
          git commit -m 'tmp-polish: replay read output [skip ci]'
          git push
