name: tmp-polish-blur
on:
  push:
    paths:
      - tmp-polish/blur-trigger.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: apply patch
        run: |
          python3 tmp-polish/blur-apply.py > tmp-polish/blur-out.txt 2>&1 || true
          git diff -- app/src/main/java/com/music/amusic/data/settings/AppSettings.kt >> tmp-polish/blur-out.txt
      - name: commit
        run: |
          git config user.name tmp-polish
          git config user.email tmp-polish@users.noreply.github.com
          git add app/src/main/java/com/music/amusic/data/settings/AppSettings.kt tmp-polish/blur-out.txt
          git commit -m 'Reduzir desfoque dinamico: padrao ligado abaixo do Android 12 [skip ci]' || echo nothing to commit
          git push origin HEAD:polish-refresh-transitions
