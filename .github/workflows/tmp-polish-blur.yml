name: tmp-polish-blur
on:
  push:
    paths:
      - tmp-polish/blur-trigger.txt
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: read snippets
        run: bash tmp-polish/blur-read.sh
      - name: commit output
        run: |
          git config user.name tmp-polish
          git config user.email tmp-polish@users.noreply.github.com
          git add tmp-polish/blur-out.txt
          git commit -m 'tmp-polish: blur read output [skip ci]' || echo nothing to commit
          git push origin HEAD:polish-refresh-transitions
