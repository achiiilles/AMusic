name: tmp-polish-lib
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/lib-run.txt']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: read
        run: python3 tmp-polish/lib-read.py
      - name: commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tmp-polish/out-a.txt tmp-polish/out-b.txt tmp-polish/out-c.txt tmp-polish/out-d.txt
          git commit -m "tmp: resultado da leitura [skip ci]"
          git pull --rebase origin polish-refresh-transitions || true
          git push origin HEAD:polish-refresh-transitions
