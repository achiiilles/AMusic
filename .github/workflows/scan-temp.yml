name: scan-temp
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/scan-temp.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: scan
        run: |
          mkdir -p scan-out
          P=shared/src/jvmSharedMain/kotlin/com/music/amusic/data/innertube/InnertubeParser.kt
          Y=shared/src/jvmSharedMain/kotlin/com/music/amusic/data/YtMusicRepository.kt
          A=shared/src/jvmSharedMain/kotlin/com/music/amusic/data/model/ArtistCredits.kt
          sed -n '556,625p' $P | cut -c1-190 | head -c 12000 > scan-out/r10.txt
          sed -n '1360,1440p' $P | cut -c1-190 | head -c 12000 > scan-out/r11.txt
          sed -n '478,525p' $Y | cut -c1-190 | head -c 12000 > scan-out/r12.txt
          sed -n '1,46p' $A | cut -c1-190 | head -c 12000 > scan-out/r13.txt
          git config user.name 'Achillles'
          git config user.email 'achillesh74@gmail.com'
          git add scan-out
          git commit -m 'temp: scan report 3 [skip ci]'
          git push origin HEAD:library-artists-merge
