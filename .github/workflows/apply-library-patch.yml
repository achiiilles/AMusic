name: Apply library patch

on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/apply-library-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: Apply patch
        run: |
          python3 - <<'PY'
          import sys
          DETAIL = "app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt"
          MAIN = "app/src/main/java/com/music/amusic/MainActivity.kt"
          def swap(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  sys.exit("anchor %s found %d times" % (label, n))
              return text.replace(old, new)
          d = open(DETAIL, encoding="utf-8").read()
          m = open(MAIN, encoding="utf-8").read()
          if "libraryArtist" in d or "inLibraryArtist" in m:
              sys.exit("already patched")
          params = "    /** The same artist inside the account's own library, when the library holds one. */\n    libraryArtist: ShelfItem? = null,\n    onLibraryArtistClick: (() -> Unit)? = null,\n"
          old1 = "    folder: LocalFolder? = null,\n) {\n    val rawSongs = (page.songs as? UiState.Success)?.data.orEmpty()\n"
          new1 = "    folder: LocalFolder? = null,\n" + params + ") {\n    val rawSongs = (page.songs as? UiState.Success)?.data.orEmpty()\n"
          d = swap(d, old1, new1, "detail-params")
          anchor2 = "            // YouTube's own editorial blurb \u2014 an album or an artist only, per\n"
          block2 = '''            if (isArtist && libraryArtist != null && onLibraryArtistClick != null) {
                item(key = "in-your-library") {
                    Column(
                        Modifier
                            .padding(top = 22.dp)
                            .clickable(onClick = onLibraryArtistClick),
                    ) {
                        SectionHeading(
                            title = "Na sua biblioteca",
                            palette = palette,
                            onShowAll = onLibraryArtistClick,
                            horizontalPadding = ARTIST_CONTENT_GUTTER,
                        )
                    }
                }
            }

'''
          d = swap(d, anchor2, block2 + anchor2, "detail-block")
          imp = "import com.music.amusic.data.model.HomeShelf\n"
          m = swap(m, imp, imp + "import com.music.amusic.data.model.isExactArtistMatch\n", "main-import")
          old4 = "                        DetailScreen(\n                            page = page,\n"
          new4 = '''                        val inLibraryArtist = remember(libraryState, page.browseId, page.title) {
                            if (page.type != BrowseType.ARTIST) {
                                null
                            } else {
                                (libraryState as? UiState.Success)?.data?.shelves
                                    ?.firstOrNull { it.title == "Artists" }
                                    ?.items
                                    ?.firstOrNull { item ->
                                        item.browseId != null &&
                                            item.browseId != page.browseId &&
                                            isExactArtistMatch(item.title, page.title)
                                    }
                            }
                        }
                        DetailScreen(
                            page = page,
                            libraryArtist = inLibraryArtist,
                            onLibraryArtistClick = inLibraryArtist?.let { item ->
                                {
                                    val id = item.browseId
                                    if (id != null) {
                                        viewModel.openDetail(
                                            browseId = id,
                                            title = item.title,
                                            subtitle = item.subtitle,
                                            thumbnailUrl = item.thumbnailUrl,
                                        )
                                    }
                                }
                            },
'''
          m = swap(m, old4, new4, "main-detailscreen")
          open(DETAIL, "w", encoding="utf-8").write(d)
          open(MAIN, "w", encoding="utf-8").write(m)
          PY
      - name: Commit and push
        run: |
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -A
          git commit -m "Library: add 'Na sua biblioteca' section to artist pages [skip ci]"
          git push origin HEAD:library-artists-merge
