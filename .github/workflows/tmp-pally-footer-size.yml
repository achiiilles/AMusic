name: tmp-pally-footer-size
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-footer-size']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Aplicar somente o tamanho do texto do bloco do fim
        run: |
          cp .pally/patch_footer_size.py /tmp/patch_footer_size.py
          python3 /tmp/patch_footer_size.py
