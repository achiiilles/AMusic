name: tmp-pally-gradprobe
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-gradprobe']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Rodar a sonda
        run: python3 .pally/probe_grad.py
      - name: Salvar o resultado
        run: |
          git config user.name pally-bot
          git config user.email pally-bot@users.noreply.github.com
          git add .pally/probe_out.txt
          git commit -m "tmp: resultado da sonda da cor da pagina [skip ci]" || echo sem mudanca
          git push
