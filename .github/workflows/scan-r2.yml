name: scan-r2
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/scan-r2.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: scan
        run: |
          mkdir -p scan-out
          F=app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          {
            echo '== 598-632 =='
            sed -n '598,632p' "$F" | cat -A | sed 's/\$$//' | cut -c1-200
            echo '== SectionHeading 1938-1995 =='
            sed -n '1938,1995p' "$F"
          } > scan-out/r2.txt
      - name: push
        run: |
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -A
          git commit -m "scan r2 output [skip ci]"
          git push origin HEAD:library-artists-merge
