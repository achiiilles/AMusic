name: tmp-pally-local-artist-veil
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-local-artist-veil']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply patch
        run: python3 .pally/patch_local_artist_veil.py
      - name: Commit
        run: |
          git config user.name "pally-bot"
          git config user.email "pally-bot@users.noreply.github.com"
          git add app/src/main/java/com/music/amusic/MainActivity.kt
          git commit -m "Local artist page: top circles wear the page colour like album pages [skip ci]"
          git push origin HEAD:polish-refresh-transitions
