name: scan-temp2
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/scan-temp2.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: scan
        run: |
          mkdir -p scan-out
          grep -rniE "your library|sua biblioteca|fromYourLibrary|from_your_library|in_your_library|inYourLibrary|libraryAlbums|libraryShelf" --include=*.kt --include=*.xml --exclude-dir=.git --exclude-dir=build --exclude-dir=scan-out . 2>/dev/null | cut -c1-240 > scan-out/s1.txt || true
          wc -l scan-out/s1.txt >> scan-out/s1.txt
      - name: push
        run: |
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -A
          git commit -m "scan report [skip ci]" || exit 0
          git push origin HEAD:library-artists-merge
