name: tmp-polish-pill
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/pill-trigger.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: aplica o patch
        run: python3 tmp-polish/pill_patch.py .
      - name: commita so os arquivos do app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git status --short
          git commit -m "AMusic: pilula de selecao da barra padrao sem corte, com animacao curta e suave [skip ci]"
          git push origin HEAD:polish-refresh-transitions
      - name: guarda o diff para leitura
        run: |
          git show HEAD --stat > tmp-polish/out-pill-stat.txt
          git show HEAD > tmp-polish/out-pill-diff.txt
          git add tmp-polish/out-pill-stat.txt tmp-polish/out-pill-diff.txt
          git commit -m "tmp: saida do patch da pilula [skip ci]"
          git push origin HEAD:polish-refresh-transitions
