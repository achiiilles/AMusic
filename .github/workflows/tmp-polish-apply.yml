name: tmp-polish-apply
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Stage 1 - public artist page and name tap
        run: |
          python3 tmp-polish/lib-page-patch.py 1
          git add app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt app/src/main/java/com/music/amusic/MainActivity.kt
          git commit -m "Pagina do artista da biblioteca: perfil publico certo e nome clicavel [skip ci]"
          git push origin HEAD:polish-refresh-transitions
      - name: Stage 2 - album count on the info line
        run: |
          python3 tmp-polish/lib-page-patch.py 2
          git add app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "Pagina do artista da biblioteca: contagem de albuns na linha de faixas e minutos [skip ci]"
          git push origin HEAD:polish-refresh-transitions
      - name: Stage 3 - round still photo
        run: |
          python3 tmp-polish/lib-page-patch.py 3
          git add app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "Pagina do artista da biblioteca: foto redonda e estatica [skip ci]"
          git push origin HEAD:polish-refresh-transitions
