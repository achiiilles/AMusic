name: rename-step
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Etapa 1, 2 ou 3'
        required: true
        default: '1'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run step
        env:
          STEP: ${{ github.event.inputs.step }}
        run: |
          set -e
          cat > /tmp/sub.pl <<'EOF'
          undef $/;
          for my $f (@ARGV) {
            open(my $h, '<', $f) or next; my $c = <$h>; close $h;
            next unless $c =~ /bitchord/i;
            my @p; my $o = $c;
            $c =~ s{(https?://[^\s"'<>)]*(?:kushagrasingh\.in|bitchord\.in|onrender\.com)[^\s"'<>)]*|[A-Za-z0-9.-]*kushagrasingh\.in|bitchord-67v8[A-Za-z0-9.-]*|bitchord-listen-together[A-Za-z0-9.-]*|kushagrasinghx/BitChord)}{push(@p,$1); "\x01P".$#p."\x02"}gie;
            $c =~ s/BitChord/AMusic/g; $c =~ s/Bitchord/AMusic/g; $c =~ s/BITCHORD/AMUSIC/g; $c =~ s/bitchord/amusic/g;
            $c =~ s/\x01P(\d+)\x02/$p[$1]/g;
            if ($c ne $o) { open(my $w, '>', $f); print $w $c; close $w; print "changed $f\n"; }
          }
          EOF
          sed -i 's/^          //' /tmp/sub.pl
          CODE='\.(kt|java|cpp|c|h|hpp)$'
          if [ "$STEP" = "1" ]; then
            git ls-files | grep -v '^\.github/' | grep -viE '^(LICENSE|NOTICE)' | grep -vE "$CODE" | xargs -d '\n' grep -lIi bitchord | xargs -d '\n' perl /tmp/sub.pl || true
          elif [ "$STEP" = "2" ]; then
            git ls-files | grep -i bitchord | grep -v '^\.github/' | while IFS= read -r f; do n=$(echo "$f" | sed 's/BitChord/AMusic/g;s/Bitchord/AMusic/g;s/BITCHORD/AMUSIC/g;s/bitchord/amusic/g'); mkdir -p "$(dirname "$n")"; git mv "$f" "$n"; done
          else
            git ls-files | grep -v '^\.github/' | grep -viE '^(LICENSE|NOTICE)' | xargs -d '\n' grep -lIi bitchord | xargs -d '\n' perl /tmp/sub.pl || true
          fi
          git config user.name 'rename-bot'
          git config user.email 'rename-bot@users.noreply.github.com'
          git add -A
          git commit -m "Rename BitChord to AMusic, step $STEP [skip ci]" || echo nothing
          git push
