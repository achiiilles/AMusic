name: tmp-polish-colorspatch
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/colorspatch-trigger.txt']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: |
          python3 tmp-polish/colorspatch.py > tmp-polish/out-colorspatch-log.txt 2>&1 || { cat tmp-polish/out-colorspatch-log.txt; git config user.name github-actions; git config user.email actions@github.com; git add tmp-polish/out-colorspatch-log.txt; git commit -m "tmp: falha do patch [skip ci]"; git push origin HEAD:polish-refresh-transitions; exit 1; }
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/music/amusic/ui/components/FrostedTopBar.kt app/src/main/java/com/music/amusic/MainActivity.kt
          git commit -m "Voltar e compartilhar com o véu claro e a borda fina dos botões, nas páginas de artista, álbum e playlist [skip ci]"
          git diff HEAD~1 HEAD > tmp-polish/out-colorspatch-diff.txt
          git add tmp-polish/out-colorspatch-log.txt tmp-polish/out-colorspatch-diff.txt
          git commit -m "tmp: diff do patch [skip ci]"
          git push origin HEAD:polish-refresh-transitions
