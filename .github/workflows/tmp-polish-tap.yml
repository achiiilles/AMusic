name: tmp-polish-tap

on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/tap-trigger.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply patch
        run: python3 tmp-polish/tap-apply.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A app tmp-polish/tap-out.txt
          git commit -m 'Profile photo opens Settings directly [skip ci]' || echo 'nothing to commit'
          git pull --rebase origin polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
