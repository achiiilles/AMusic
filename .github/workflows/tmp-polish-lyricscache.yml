name: tmp-polish-lyricscache
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/lyricscache-trigger.txt']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          push() { for i in 1 2 3 4 5; do git pull --rebase origin polish-refresh-transitions && git push origin HEAD:polish-refresh-transitions && return 0; sleep 5; done; return 1; }
          python3 tmp-polish/lyricscache.py > tmp-polish/out-lyricscache-log.txt 2>&1 || { cat tmp-polish/out-lyricscache-log.txt; git add tmp-polish/out-lyricscache-log.txt; git commit -m "tmp: falha do patch de letras [skip ci]"; push; exit 1; }
          git add app/src/main/java/com/music/amusic/data/lyrics/LyricsCache.kt app/src/main/java/com/music/amusic/ui/MainViewModel.kt
          git commit -m "Letras achadas automaticamente ficam salvas no aparelho (com a fonte); a fonte escolhida na mao substitui a salva [skip ci]"
          git diff HEAD~1 HEAD > tmp-polish/out-lyricscache-diff.txt
          git add tmp-polish/out-lyricscache-log.txt tmp-polish/out-lyricscache-diff.txt
          git commit -m "tmp: diff do patch de letras [skip ci]"
          push
