name: Android Debug APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply prepared files
      run: |
        set -euo pipefail
        BASE=1ecf520693bf75dedf64e877c4f4fd6db7aa8cfa
        CHANGED=$(git diff --name-only "$BASE" HEAD)
        echo "changed since base: $CHANGED"
        test "$CHANGED" = ".github/workflows/debug-apk.yml"
        curl -fsSL -o pkg.zip "https://my.pally.com/f/4n7EjfKrjEfl?download=1"
        echo "668e103be1a12671f1bb08ec85dc6e9f8aeb77691cb93648dd92b5b199f83604  pkg.zip" | sha256sum -c -
        mkdir pkg
        unzip -q pkg.zip -d pkg
        jq -r 'to_entries[] | "\(.value.sha256)  pkg/\(.key)"' pkg/manifest.json | sha256sum -c -
        for f in $(jq -r 'keys[]' pkg/manifest.json); do
          test -f "$f"
          cp "pkg/$f" "$f"
        done
        rm -rf pkg pkg.zip
        git config user.name "pally"
        git config user.email "pally@users.noreply.github.com"
        git add app/src/main/java
        git status --short
        git commit -m "Talvez voce goste: Last.fm em paralelo, cards progressivos, cada artista do credito, retry em 429, casamento Apple sem homonimo e + local [skip ci]"
        git push origin HEAD:polish-refresh-transitions
