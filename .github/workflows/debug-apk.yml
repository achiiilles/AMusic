        '''))
        E.append((r'''app/src/main/java/com/music/amusic/MainActivity.kt''', r'''                        val found = YtMusicRepository.findArtistPageId(name).getOrNull()
        ''', r'''                        // Several artists can share a name: the one opened is the one
