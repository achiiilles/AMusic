name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dev-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4

    - name: Write local.properties (Last.fm keys are optional)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Apply strict matching to Apple recommendation cards
      run: |
        python3 - <<'PY'
        from pathlib import Path

        path = Path('app/src/main/java/com/music/amusic/data/canvas/AppleAlbumShelves.kt')
        text = path.read_text(encoding='utf-8')
        old_target = '    val releaseLine: String = "",\n) {'
        new_target = '    val releaseLine: String = "",\n    /** Original Apple catalog title retained for edition matching. */\n    val appleCatalogTitle: String = title,\n) {'
        if text.count(old_target) != 1:
            raise SystemExit(f'Expected one AppleShelfTarget declaration, found {text.count(old_target)}')
        text = text.replace(old_target, new_target, 1)

        old_card = '        targets[key] = AppleShelfTarget(key, shownTitle, subtitle, url, isAlbum, releaseLine)'
        new_card = '        targets[key] = AppleShelfTarget(key, shownTitle, subtitle, url, isAlbum, releaseLine, name)'
        if text.count(old_card) != 1:
            raise SystemExit(f'Expected one Apple card target, found {text.count(old_card)}')
        text = text.replace(old_card, new_card, 1)

        start_marker = '    /**\n     * The YouTube Music album that is the same release as an Apple card, found\n'
        end_marker = '    /**\n     * An Apple Music playlist with the songs the catalog returns for it (its\n'
        if text.count(start_marker) != 1:
            raise SystemExit(f'Expected one existing resolver, found {text.count(start_marker)}')
        start = text.index(start_marker)
        end = text.find(end_marker, start)
        if end < 0:
            raise SystemExit('Could not find the next Apple playlist method')
        new_method = '\n'.join([
            '    /**',
            '     * Match one Apple recommendation to a YouTube Music album.',
            '     * Search cards expose no track list, so compare title, artist and any',
            '     * available edition, year and release-kind details. Require exactly one',
            '     * compatible result; otherwise the caller opens the Apple track list.',
            '     */',
            '    suspend fun youtubeAlbumFor(target: AppleShelfTarget): String? {',
            '        youtubeIds[target.id]?.let { return it.takeIf { id -> id.isNotEmpty() } }',
            '        if (!target.isAlbum || AppleReleaseMatcher.cleanTitle(target.title).isBlank()) return null',
            '        val hits = runCatching {',
            '            YtMusicRepository.search("${target.artist} ${target.title}".trim(), SearchFilter.ALBUMS)',
            '                .getOrNull()',
            '        }.getOrNull() ?: return null',
            '        val candidates = hits.mapNotNull { hit ->',
            '            val item = (hit as? SearchResult.Browse)?.item ?: return@mapNotNull null',
            '            YouTubeAlbumCandidate(',
            '                browseId = item.browseId,',
            '                title = item.title,',
            '                subtitle = item.subtitle,',
            '            )',
            '        }',
            '        val matches = AppleYouTubeAlbumMatcher.matchingBrowseIds(',
            '            appleDisplayTitle = target.title,',
            '            appleCatalogTitle = target.appleCatalogTitle,',
            '            appleArtist = target.artist,',
            '            appleReleaseLine = target.releaseLine,',
            '            candidates = candidates,',
            '        )',
            '        val found = matches.singleOrNull()',
            '        youtubeIds[target.id] = found.orEmpty()',
            '        return found',
            '    }',
            '',
        ])
        text = text[:start] + new_method + text[end:]
        path.write_text(text, encoding='utf-8')
        PY
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app/src/main/java/com/music/amusic/data/canvas/AppleAlbumShelves.kt
        git commit -m "Connect strict matching to Apple recommendations"
        git fetch origin polish-refresh-transitions
        git rebase origin/polish-refresh-transitions
        git push origin HEAD:polish-refresh-transitions

    - name: Run Dev Debug Unit Tests
      run: ./gradlew :app:testDevDebugUnitTest

    - name: Build Dev Debug APK
      run: ./gradlew :app:assembleDevDebug

    - name: Re-sign APK with the project key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amusic.jks"
        APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        for f in app/build/outputs/apk/dev/debug/*.apk; do
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/amusic.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "$f"
          "$APKSIGNER" verify "$f"
        done
        rm -f "$RUNNER_TEMP/amusic.jks"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: amusic-dev-debug
        path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
        if-no-files-found: error
