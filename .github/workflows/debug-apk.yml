name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dev-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Write local.properties (Last.fm keys are optional)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Apply and commit Apple-YouTube track matching on the test branch
      run: |
        python3 - <<'PY'
        from pathlib import Path

        shelf_path = Path('app/src/main/java/com/music/amusic/data/canvas/AppleAlbumShelves.kt')
        shelf = shelf_path.read_text(encoding='utf-8')
        start_marker = '    /**\n     * Match one Apple recommendation to a YouTube Music album.'
        end_marker = '    /**\n     * An Apple Music playlist with the songs the catalog returns for it (its'
        if shelf.count(start_marker) != 1:
            raise SystemExit(f'Expected one Apple recommendation resolver, found {shelf.count(start_marker)}')
        start = shelf.index(start_marker)
        end = shelf.find(end_marker, start)
        if end < 0:
            raise SystemExit('Could not find the playlist resolver after the Apple album resolver')
        new_method = """    /**
         * Match one Apple recommendation to a YouTube Music album.
         * Compare card metadata first, then require the complete released Apple
         * track list and the complete YouTube album track list to agree.
         */
        suspend fun youtubeAlbumFor(target: AppleShelfTarget): String? {
            youtubeIds[target.id]?.let { return it.takeIf { id -> id.isNotEmpty() } }
            if (!target.isAlbum || AppleReleaseMatcher.cleanTitle(target.title).isBlank()) return null
            val appleAlbum = ApplePreRelease.album(target.appleId) ?: return null
            val appleTracks = appleAlbum.tracks
            if (appleTracks.isEmpty() || appleTracks.any { !it.released || it.name.isBlank() }) return null
            val hits = YtMusicRepository.search("${target.artist} ${target.title}".trim(), SearchFilter.ALBUMS)
                .getOrNull() ?: return null
            val candidates = hits.mapNotNull { hit ->
                val item = (hit as? SearchResult.Browse)?.item ?: return@mapNotNull null
                YouTubeAlbumCandidate(item.browseId, item.title, item.subtitle)
            }
            val metadataMatches = AppleYouTubeAlbumMatcher.matchingBrowseIds(
                appleDisplayTitle = target.title,
                appleCatalogTitle = target.appleCatalogTitle,
                appleArtist = target.artist,
                appleReleaseLine = target.releaseLine,
                candidates = candidates,
            )
            if (metadataMatches.isEmpty()) {
                youtubeIds[target.id] = ""
                return null
            }
            val appleTitles = appleTracks.map { it.name }
            val gate = Semaphore(3)
            val checked = coroutineScope {
                metadataMatches.map { browseId ->
                    async(Dispatchers.IO) {
                        gate.withPermit {
                            val youtubeTitles = completeYouTubeTrackTitles(browseId) ?: return@withPermit null
                            browseId.takeIf { AppleYouTubeAlbumMatcher.sameTrackList(appleTitles, youtubeTitles) }
                        }
                    }
                }.awaitAll()
            }
            // If any plausible album could not be read completely, it remains a
            // possible match. Do not choose another candidate around that gap.
            if (checked.any { it == null }) return null
            val found = checked.filterNotNull().distinct().singleOrNull()
            youtubeIds[target.id] = found.orEmpty()
            return found
        }

        private suspend fun completeYouTubeTrackTitles(browseId: String): List<String>? {
            val first = YtMusicRepository.browseSongs(browseId).getOrNull() ?: return null
            val titles = first.songs.mapTo(mutableListOf()) { it.title }
            var continuation = first.continuation
            var pages = 1
            while (continuation != null && pages < YtMusicRepository.MAX_PAGES) {
                val page = YtMusicRepository.moreSongs(continuation).getOrNull() ?: return null
                if (page.songs.isEmpty() && page.continuation != null) return null
                titles += page.songs.map { it.title }
                continuation = page.continuation
                pages++
            }
            if (continuation != null || titles.isEmpty()) return null
            return titles
        }

"""
        shelf = shelf[:start] + new_method + shelf[end:]
        shelf_path.write_text(shelf, encoding='utf-8')

        matcher_path = Path('app/src/main/java/com/music/amusic/data/canvas/AppleYouTubeAlbumMatcher.kt')
        matcher = matcher_path.read_text(encoding='utf-8')
        if 'import java.text.Normalizer' not in matcher:
            matcher = matcher.replace('package com.music.amusic.data.canvas\n',
                                      'package com.music.amusic.data.canvas\n\nimport java.text.Normalizer\nimport java.util.Locale\n', 1)
        if 'fun sameTrackList(' not in matcher:
            closing = matcher.rfind('\n}')
            if closing < 0:
                raise SystemExit('Could not find the end of AppleYouTubeAlbumMatcher')
            matcher_addition = """

            /** Requires the complete lists to contain the same track titles and duplicate counts. */
            fun sameTrackList(appleTitles: List<String>, youtubeTitles: List<String>): Boolean {
                if (appleTitles.isEmpty() || appleTitles.size != youtubeTitles.size) return false
                val appleKeys = appleTitles.map(::trackKey)
                val youtubeKeys = youtubeTitles.map(::trackKey)
                if (appleKeys.any { it.isBlank() } || youtubeKeys.any { it.isBlank() }) return false
                return appleKeys.groupingBy { it }.eachCount() == youtubeKeys.groupingBy { it }.eachCount()
            }

            private fun trackKey(title: String): String =
                Normalizer.normalize(title, Normalizer.Form.NFKD)
                    .lowercase(Locale.ROOT)
                    .filter { it.isLetterOrDigit() }
"""
            matcher = matcher[:closing] + matcher_addition + matcher[closing:]
        matcher_path.write_text(matcher, encoding='utf-8')

        test_path = Path('app/src/test/java/com/music/amusic/data/canvas/AppleYouTubeAlbumMatcherTest.kt')
        tests = test_path.read_text(encoding='utf-8')
        if 'track lists match only when every title agrees' not in tests:
            closing = tests.rfind('\n}')
            if closing < 0:
                raise SystemExit('Could not find the end of AppleYouTubeAlbumMatcherTest')
            tests_addition = """

            @Test
            fun `track lists match only when every title agrees`() {
                assertTrue(
                    AppleYouTubeAlbumMatcher.sameTrackList(
                        listOf("Don't Start Now", "Levitating", "Physical"),
                        listOf("Physical", "Don’t Start Now", "Levitating"),
                    ),
                )
                assertTrue(
                    !AppleYouTubeAlbumMatcher.sameTrackList(
                        listOf("Don't Start Now", "Levitating", "Physical"),
                        listOf("Don't Start Now", "Levitating (Live)", "Physical"),
                    ),
                )
            }

            @Test
            fun `different counts and empty lists are not a track match`() {
                assertTrue(
                    !AppleYouTubeAlbumMatcher.sameTrackList(
                        listOf("Intro", "Song", "Song"),
                        listOf("Intro", "Song"),
                    ),
                )
                assertTrue(!AppleYouTubeAlbumMatcher.sameTrackList(emptyList(), emptyList()))
            }
"""
            tests = tests[:closing] + tests_addition + tests[closing:]
        test_path.write_text(tests, encoding='utf-8')
        PY
        git add app/src/main/java/com/music/amusic/data/canvas/AppleAlbumShelves.kt app/src/main/java/com/music/amusic/data/canvas/AppleYouTubeAlbumMatcher.kt app/src/test/java/com/music/amusic/data/canvas/AppleYouTubeAlbumMatcherTest.kt
        if ! git diff --cached --quiet; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Compare Apple and YouTube album track lists"
          git fetch origin polish-refresh-transitions
          git rebase origin/polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
        fi

    - name: Run Apple-YouTube album matching tests
      run: ./gradlew :app:testDevDebugUnitTest --tests 'com.music.amusic.data.canvas.AppleYouTubeAlbumMatcherTest' --console=plain

    - name: Run full unit test suite for diagnosis
      continue-on-error: true
      run: |
        if ./gradlew :app:testDevDebugUnitTest --console=plain; then
          echo "Full unit test suite passed" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "The full suite still has failures outside the Apple-YouTube album matcher. The focused matcher tests are run separately; APK compilation will continue." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Build Dev Debug APK
      run: ./gradlew :app:assembleDevDebug --console=plain

    - name: Re-sign APK with the project key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amusic.jks"
        APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        for f in app/build/outputs/apk/dev/debug/*.apk; do
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/amusic.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "$f"
          "$APKSIGNER" verify "$f"
        done
        rm -f "$RUNNER_TEMP/amusic.jks"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: amusic-dev-debug
        path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
        if-no-files-found: error
