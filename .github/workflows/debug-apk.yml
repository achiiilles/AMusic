name: Android Debug APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply prepared edits
      run: |
        set -euo pipefail
        BASE=e136d257af9c87784faf8f960488d446444bb8bf
        CHANGED=$(git diff --name-only "$BASE" HEAD)
