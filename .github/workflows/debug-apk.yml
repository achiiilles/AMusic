                }
                if (sameName > 1) return Entry(null)
                var page: String? = null
                for (i in 0 until results.length()) {'''))
        E.append((r'''app/src/main/java/com/music/amusic/data/canvas/AppleArtistArt.kt''', r'''AppleLookupStore.readArtist(key)''', r'''AppleLookupStore.readArtist("v2$key")'''))
        E.append((r'''app/src/main/java/com/music/amusic/data/canvas/AppleArtistArt.kt''', r'''AppleLookupStore.writeArtist(key, art)''', r'''AppleLookupStore.writeArtist("v2$key", art)'''))
        texts = {}
        for p, o, n in E:
            if p not in texts:
                with open(p, encoding="utf-8", newline="") as f:
                    texts[p] = f.read()
            c = texts[p].count(o)
            if c != 1:
                print("ANCHOR COUNT", c, p, o[:80])
                sys.exit(1)
            texts[p] = texts[p].replace(o, n, 1)
        for p, t in texts.items():
            with open(p, "w", encoding="utf-8", newline="") as f:
                f.write(t)
            print("edited", p)
        PY
