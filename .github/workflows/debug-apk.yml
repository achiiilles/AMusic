name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      publish_shelf_pages:
        description: 'Temporary shelf publication only, no APK build'
        type: boolean
        required: false
        default: false

jobs:
  publish-shelf-pages:
    if: ${{ inputs.publish_shelf_pages == true && github.ref == 'refs/heads/polish-refresh-transitions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout only the polish branch
        uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Validate and publish prepared copies, restore this workflow
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, hashlib, urllib.request
          assert os.environ['CURRENT_REF'] == 'refs/heads/polish-refresh-transitions'
          branch = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
          assert branch == 'polish-refresh-transitions', branch
          base = pathlib.Path('app/src/main/java/com/music/amusic')
          files = [
              ('data/canvas/AppleAlbumShelves.kt', '6eac622200620f6269d35b46775fa92609eb40a4', '9760e031039fc83191af4a95bbfed6d4de3cd559', 'https://my.pally.com/f/86XLBFlHjcQ2?download=1'),
              ('ui/screens/DetailScreen.kt', '0eed676753cd5bb2d293d47bdee2e03fec26b715', '7b8749b547358abcb173ceb22a04d6dc73131984', 'https://my.pally.com/f/p1aiZRDcrQLR?download=1'),
              ('ui/MainViewModel.kt', '0969f8fd4aeb34aa56964b723c29408afdda06e1', 'eb419da1502dffa1afaf3693e9d1ec86722c85fe', 'https://my.pally.com/f/GgxHy62qXbKr?download=1'),
          ]
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          downloads = []
          for relative, old_sha, new_sha, url in files:
              target = base / relative
              assert blob(target.read_bytes()) == old_sha, 'Source changed: ' + relative
              request = urllib.request.Request(url, headers={'User-Agent': 'AMusic-source-publication'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read(1000000)
              assert blob(data) == new_sha, 'Prepared copy mismatch: ' + relative
              downloads.append((target, data))
          workflow = pathlib.Path('.github/workflows/debug-apk.yml')
          original_workflow = subprocess.check_output(['git', 'show', 'dbfde1b060887a6199a24b5b25078afa2751d681:.github/workflows/debug-apk.yml'])
          assert blob(original_workflow) == 'f1cd24e177438fe78c9b16d34a9ddae72bd42f43'
          for target, data in downloads:
              target.write_bytes(data)
              print(str(target), len(data), blob(data))
          workflow.write_bytes(original_workflow)
          paths = [str(target) for target, _ in downloads] + [str(workflow)]
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--'] + paths, check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(staged) == set(paths), staged
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Warm artist lookup on tap and show shelf first pages with reserved rows [skip ci]'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/polish-refresh-transitions'], check=True)
          print('PUBLISHED_COMMIT', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          for relative, old_sha, new_sha, url in files:
              remote = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + str(base / relative)], text=True).strip()
              assert remote == new_sha
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD:.github/workflows/debug-apk.yml'], text=True).strip() == 'f1cd24e177438fe78c9b16d34a9ddae72bd42f43'
          PY

  build-dev-debug:
    if: ${{ inputs.publish_shelf_pages != true }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Write local.properties (Last.fm keys are optional)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug

    - name: Re-sign APK with the project key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amusic.jks"
        APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        for f in app/build/outputs/apk/dev/debug/*.apk; do
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/amusic.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "$f"
          "$APKSIGNER" verify "$f"
        done
        rm -f "$RUNNER_TEMP/amusic.jks"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: amusic-dev-debug
        path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
        if-no-files-found: error
