name: tmp-polish-tr
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/tr-trigger.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: python3 tmp-polish/tr-apply.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sharedUi tmp-polish/out-tr.txt
          git commit -m "Traduz capsulas e textos da tela de Pesquisar para portugues [skip ci]"
          git push
