name: tmp-pally-minifix
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-minifix']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Restaurar e aplicar a mudanca do mini player
        run: python3 .pally/fix_mini.py
      - name: Salvar
        run: |
          git config user.name pally-bot
          git config user.email pally-bot@users.noreply.github.com
          git add app/src/main/java/com/music/amusic/ui/components/MiniPlayer.kt app/src/main/java/com/music/amusic/ui/components/GlassNavBar.kt
          git commit -m "Mini player: volta a seguir o tema Claro/Escuro com o mesmo fundo da barra de navegacao, sem a cor tirada do album (cor desligada, funcoes mantidas) [skip ci]"
          git push
