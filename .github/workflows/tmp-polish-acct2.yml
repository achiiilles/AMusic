name: tmp-polish-acct2
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/acct2-trigger.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: run
        run: python3 tmp-polish/acct-apply.py > tmp-polish/acct2-out.txt 2>&1 || true
      - name: push
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A app tmp-polish
          git commit -m "Oculta linha Configuracoes do popup Alternar conta [skip ci]" || true
          git pull --rebase origin polish-refresh-transitions || true
          git push origin HEAD:polish-refresh-transitions
