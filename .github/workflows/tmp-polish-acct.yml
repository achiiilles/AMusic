name: tmp-polish-acct
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/acct-trigger.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: run
        run: bash tmp-polish/acct-read.sh
      - name: push
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A tmp-polish
          git commit -m "tmp acct out [skip ci]" || true
          git pull --rebase origin polish-refresh-transitions || true
          git push origin HEAD:polish-refresh-transitions
