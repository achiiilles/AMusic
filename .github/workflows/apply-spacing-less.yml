name: Apply spacing and collapse patch
on:
  push:
    branches: [library-artists-merge]
    paths:
      - '.github/workflows/apply-spacing-less.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: Apply patch and push
        run: |
          python3 - <<'PYEOF'
          import io
          def edit(path, pairs):
              t = io.open(path, encoding='utf-8', newline='').read()
              for old, new in pairs:
                  assert t.count(old) == 1, (path, old[:50], t.count(old))
                  t = t.replace(old, new)
              io.open(path, 'w', encoding='utf-8', newline='').write(t)
          D = 'app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt'
          edit(D, [
          (r'''            val description = page.description

                      if (songs.isNotEmpty() && isArtist) {''',
          r'''            val description = page.description

                      // "Na sua biblioteca" is drawn only when the library holds this artist.
                      val showLibraryHeading = isArtist && libraryArtist != null && onLibraryArtistClick != null

                      if (songs.isNotEmpty() && isArtist) {'''),
          (r'''                        bottomSpace = 22.dp,
                                  playColor''',
          r'''                        // With the heading below, the gap above and below it is shared
                                  // (6 + 14 above its text, 20 below) so it sits centred between
                                  // the buttons and the album card.
                                  bottomSpace = if (showLibraryHeading) 6.dp else 22.dp,
                                  playColor'''),
          (r'''            if (isArtist && libraryArtist != null && onLibraryArtistClick != null) {
                          item(key = "in-your-library") {
                              SectionHeading(
                                  title = "Na sua biblioteca",
                                  palette = palette,
                                  onShowAll = onLibraryArtistClick,
                                  horizontalPadding = ARTIST_CONTENT_GUTTER,
                              )''',
          r'''            if (showLibraryHeading) {
                          item(key = "in-your-library") {
                              SectionHeading(
                                  title = "Na sua biblioteca",
                                  palette = palette,
                                  onShowAll = onLibraryArtistClick,
                                  horizontalPadding = ARTIST_CONTENT_GUTTER,
                                  topPadding = 14.dp,
                                  bottomPadding = 20.dp,
                              )'''),
          (r'''                                onShowAll = if (previewSongs && matches.size > 5) {
                                              { songsExpanded = true }
                                          } else {
                                              null
                                          },
                                      )''',
          r'''                                // Ver tudo opens the whole list; once open, the same
                                          // button reads Ver menos and folds it back to five.
                                          onShowAll = if (query.isBlank() && matches.size > 5) {
                                              { songsExpanded = !songsExpanded }
                                          } else {
                                              null
                                          },
                                          showAllText = if (songsExpanded) stringResource(R.string.show_less) else null,
                                      )'''),
          (r'''    onShowAll: (() -> Unit)? = null,
              horizontalPadding: Dp = PAGE_GUTTER,
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          start = horizontalPadding,
                          end = horizontalPadding,
                          top = 10.dp,
                          bottom = 8.dp,
                      ),''',
          r'''    onShowAll: (() -> Unit)? = null,
              horizontalPadding: Dp = PAGE_GUTTER,
              topPadding: Dp = 10.dp,
              bottomPadding: Dp = 8.dp,
              /** Replaces the default "Show all" label, e.g. with "Show less" once a list is open. */
              showAllText: String? = null,
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(
                          start = horizontalPadding,
                          end = horizontalPadding,
                          top = topPadding,
                          bottom = bottomPadding,
                      ),'''),
          (r'''                text = stringResource(R.string.show_all),
                          style = MaterialTheme.typography.titleSmall,
                          color = palette.accent,
                          modifier = Modifier
                              .clickable(onClick = onShowAll)''',
          r'''                text = showAllText ?: stringResource(R.string.show_all),
                          style = MaterialTheme.typography.titleSmall,
                          color = palette.accent,
                          modifier = Modifier
                              .clickable(onClick = onShowAll)'''),
          ])
          edit('app/src/main/res/values/strings.xml', [('    <string name="show_all">Show all</string>', '    <string name="show_all">Show all</string>\n    <string name="show_less">Show less</string>')])
          edit('app/src/main/res/values-pt/strings.xml', [('    <string name="show_all">Ver tudo</string>', '    <string name="show_all">Ver tudo</string>\n    <string name="show_less">Ver menos</string>')])
          PYEOF
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add app
          git commit -m "Centre Na sua biblioteca heading and add Ver menos to collapse the songs list [skip ci]"
          git push origin HEAD:library-artists-merge
