name: tmp pally library page pull refresh

on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.github/workflows/tmp-pally-librarypull.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply patch and commit
        run: python3 .github/scripts/tmp_pally_librarypull.py
