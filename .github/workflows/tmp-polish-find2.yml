name: tmp-polish-find2
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/find2-trigger.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: bash tmp-polish/find2.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tmp-polish/out-find2.txt
          git commit -m "Temporario: saida da leitura 2 [skip ci]"
          git push
