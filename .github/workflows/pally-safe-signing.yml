name: AMusic safe BitChord signing test
on:
  push:
    branches:
      - pally-safe-signing-2026-10-31
permissions:
  contents: read
jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out BitChord at a fixed revision
        uses: actions/checkout@v4
        with:
          repository: kushagrasinghx/BitChord
          ref: b690dc146009d4815825fa4a20815ef2e4ee8898
          path: source
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: source/**/*.gradle*
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set AMusic package name and label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          build_file = Path('source/app/build.gradle.kts')
          text = build_file.read_text()
          text, app_id_count = re.subn(
              r'(?m)^(\s*applicationId\s*=\s*)"com\.music\.bitchord"',
              r'\1"com.music.amusic"', text, count=1)
          if app_id_count != 1:
              raise SystemExit('Expected one BitChord applicationId; no files were changed in AMusic.')
          old_prefix = 'buildConfigField("String", "UPDATE_APK_PREFIX", "\\"BitChord-\\"")'
          new_prefix = 'buildConfigField("String", "UPDATE_APK_PREFIX", "\\"AMusic-\\"")'
          if old_prefix not in text:
              raise SystemExit('Could not locate the BitChord APK name prefix.')
          build_file.write_text(text.replace(old_prefix, new_prefix, 1))

          changed = 0
          for strings_file in Path('source/app/src/main/res').glob('values*/strings.xml'):
              strings = strings_file.read_text()
              updated, count = re.subn(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\1AMusic\2', strings, count=1, flags=re.S)
              if count:
                  strings_file.write_text(updated)
                  changed += 1
          if changed == 0:
              raise SystemExit('Could not locate the app_name resource.')
          print(f'AMusic applicationId and app label prepared in {changed} language files; versionCode remains 36.')
          PY
      - name: Build unsigned production APKs
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleProdRelease
      - name: Upload unsigned APKs for the separate signing job
        uses: actions/upload-artifact@v4
        with:
          name: amusic-unsigned-candidate
          path: source/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
  sign:
    needs: build-unsigned
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download the unsigned APKs
        uses: actions/download-artifact@v4
        with:
          name: amusic-unsigned-candidate
          path: unsigned
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android signing tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install 'build-tools;35.0.0' >/dev/null
      - name: Sign with AMusic key and check the certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/amusic-release.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          mkdir -p signed
          key_cert=$(keytool -exportcert -rfc -keystore "$keyfile" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          mapfile -t apks < <(find unsigned -type f -name '*.apk' -print | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            output="signed/$(basename "$apk")"
            "$apksigner" sign --ks "$keyfile" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$output" "$apk"
            "$apksigner" verify --verbose "$output"
            apk_cert=$("$apksigner" verify --print-certs "$output" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')
            test -n "$apk_cert"
            if [ "$apk_cert" != "$key_cert" ]; then
              echo 'APK certificate does not match the AMusic signing key.'
              exit 1
            fi
          done
          printf '%s\n' "$key_cert" > signed/certificate-sha256.txt
          echo "Signed APK certificate matches the existing AMusic key: $key_cert"
      - name: Upload signed APKs only
        uses: actions/upload-artifact@v4
        with:
          name: amusic-signed-candidate
          path: signed/*
          if-no-files-found: error
