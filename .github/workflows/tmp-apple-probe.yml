name: tmp apple probe
on:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - '.github/tmp-apple-probe.py'
      - '.github/workflows/tmp-apple-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: python3 .github/tmp-apple-probe.py
