name: tmp polish patch
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/run.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 tmp-polish/recon.py
      - name: Commit result
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add app/src/main/java/com/music/amusic/MainActivity.kt tmp-polish/out.txt
          if git diff --cached --quiet; then echo nothing to commit; else git commit -m 'Keep the Ver tudo list when going back from an album [skip ci]' && git push; fi
