name: tmp polish patch

on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/run.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 tmp-polish/patch.py
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -- app
          git commit -m "Album page: search and sort move into the more menu [skip ci]"
          git push
