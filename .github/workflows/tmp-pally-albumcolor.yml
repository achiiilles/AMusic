name: tmp-pally-albumcolor
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-albumcolor']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Aplicar as substituicoes
        run: python3 .pally/patch_albumcolor.py
      - name: Commitar so os arquivos do app
        run: |
          git config user.name pally-bot
          git config user.email pally-bot@users.noreply.github.com
          git add app/src/main/java/com/music/amusic/data/canvas/AppleMusicCanvas.kt app/src/main/java/com/music/amusic/data/canvas/AppleAlbumColorRepository.kt sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/theme/ArtworkPalette.kt app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt app/src/main/java/com/music/amusic/MainActivity.kt
          git commit -m "Paginas de album e single: cor de fundo vinda da API do Apple Music, com fade quando chega depois da capa [skip ci]"
          git push
