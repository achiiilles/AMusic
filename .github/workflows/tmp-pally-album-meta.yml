name: tmp-pally-album-meta
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-album-meta']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Aplicar somente os metadados
        run: |
          sed -i '/assert value.count/d' .pally/patch_album_meta.py
          python3 .pally/patch_album_meta.py
