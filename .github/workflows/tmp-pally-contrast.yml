name: tmp-pally-contrast
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-contrast']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply patch
        run: python3 .pally/patch_contrast.py
      - name: Commit
        run: |
          git config user.name "pally-bot"
          git config user.email "pally-bot@users.noreply.github.com"
          git add app/src/main/java/com/music/amusic/ui/components/LiquidGlass.kt app/src/main/java/com/music/amusic/ui/components/FrostedTopBar.kt app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "Tema Claro: mais contraste nos circulos e capsulas (shuffle, +/check, voltar, pilula do topo) [skip ci]"
          git push origin HEAD:polish-refresh-transitions
