name: tmp-pally-badge-land
on:
  push:
    branches:
      - polish-refresh-transitions
    paths:
      - tmp-pally-land-run.txt
permissions:
  contents: write
jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Inventario completo
        run: |
          set -e
          grep -rniE "ExplicitBadge|ExplicitSongTitle" --include=*.kt app sharedUi > tmp-badge-report.txt || true
          wc -l tmp-badge-report.txt
          git config user.name pally
          git config user.email pally@users.noreply.github.com
          git add tmp-badge-report.txt
          git commit -m "Temporario: inventario completo do selo E [skip ci]"
          git push origin HEAD:polish-refresh-transitions
      - name: Patch do player em paisagem
        run: |
          set -e
          cat > /tmp/patch.py <<'PY'
          import io, sys

          def read(p):
              with io.open(p, encoding='utf-8') as f:
                  return f.read()

          def write(p, s):
              with io.open(p, 'w', encoding='utf-8') as f:
                  f.write(s)

          p = 'sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/player/LandscapePlayer.kt'
          s = read(p)
          old = 'leading = if (song.isExplicit == true)'
          n = s.count(old)
          if n != 1:
              sys.exit('anchor matched %d time(s)' % n)
          s = s.replace(old, 'trailing = if (song.isExplicit == true)', 1)
          write(p, s)
          print('patched ok')
          PY
          python3 /tmp/patch.py
          git add -A
          git commit -m "Selo E depois do nome tambem no player em paisagem [skip ci]"
          git push origin HEAD:polish-refresh-transitions
      - name: Remove o workflow temporario
        run: |
          set -e
          git rm -q .github/workflows/tmp-pally-badge-land.yml tmp-pally-land-run.txt
          git commit -m "Remove o workflow temporario do selo E em paisagem [skip ci]"
          git push origin HEAD:polish-refresh-transitions
          git log --oneline -5
