name: tmp polish recon
on:
  push:
    paths:
      - 'tmp-polish/run.txt'
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp-polish/recon.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tmp-polish/out.txt
          git commit -m "tmp recon output [skip ci]" || echo nothing
          git push
