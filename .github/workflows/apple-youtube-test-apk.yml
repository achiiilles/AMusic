name: Apple-YouTube comparison test APK

on:
  push:
    branches:
      - polish-refresh-transitions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Apply full Apple-YouTube track comparison and focused tests
        run: python3 .github/scripts/apply_apple_youtube_track_match.py
      - name: Run focused Apple-YouTube matcher tests
        run: ./gradlew :app:testDevDebugUnitTest --tests 'com.music.amusic.data.canvas.AppleYouTubeAlbumMatcherTest' --console=plain
      - name: Build Dev Debug APK
        run: ./gradlew :app:assembleDevDebug --console=plain
      - name: Commit tested source changes on the test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/amusic/data/canvas/AppleAlbumShelves.kt app/src/main/java/com/music/amusic/data/canvas/AppleYouTubeAlbumMatcher.kt app/src/test/java/com/music/amusic/data/canvas/AppleYouTubeAlbumMatcherTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "Compare full Apple and YouTube album tracks [skip ci]"
            git push origin HEAD:refs/heads/polish-refresh-transitions
          fi
      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amusic-dev-debug
          path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
          if-no-files-found: error
