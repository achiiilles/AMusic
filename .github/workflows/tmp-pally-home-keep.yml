name: tmp-pally-home-keep
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-home-keep']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply patch
        run: python3 .pally/patch_home_keep.py
      - name: Commit
        run: |
          git config user.name "pally-bot"
          git config user.email "pally-bot@users.noreply.github.com"
          git add app/src/main/java/com/music/amusic/MainActivity.kt
          git commit -m "Home: do not re-fetch the feed when returning from an album or another tab [skip ci]"
          git push origin HEAD:polish-refresh-transitions
