name: tmp-polish-nav
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/nav-trigger.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: aplica o patch
        run: python3 tmp-polish/nav_patch.py .
      - name: commita so os arquivos do app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git status --short
          git commit -m "AMusic: barra padrao com o layout e a animacao do vidro liquido (pilula de 3 itens, bolinha de Pesquisar, mini player junto, recolhe ao rolar) [skip ci]"
          git push origin HEAD:polish-refresh-transitions
      - name: guarda o diff para leitura
        run: |
          git show HEAD --stat > tmp-polish/out-nav-stat.txt
          git show HEAD > tmp-polish/out-nav-diff.txt
          git add tmp-polish/out-nav-stat.txt tmp-polish/out-nav-diff.txt
          git commit -m "tmp: saida do patch da barra [skip ci]"
          git push origin HEAD:polish-refresh-transitions
