name: Temp patch tabRow (Pally)

on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.github/tmp/patch_tabrow.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/polish-refresh-transitions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions

      - name: Apply one-line patch
        run: python3 .github/tmp/patch_tabrow.py

      - name: Commit patch and remove temp script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/amusic/ui/components/floatingtabbar/FloatingTabBar.kt
          git rm -q .github/tmp/patch_tabrow.py
          git commit -m "perf: layerBackdrop(tabRow) so roda com vidro ligado [skip ci]"
          git push origin HEAD:polish-refresh-transitions
