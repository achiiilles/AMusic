name: tmp-polish-size
on:
  push:
    branches: [polish-refresh-transitions]
    paths: [tmp-polish/size-trigger.txt]
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: bash tmp-polish/size-read.sh
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tmp-polish/out-size.txt
          git commit -m "tmp size out [skip ci]" || true
          git push || true
