name: Apply calm fold
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/apply-calm-fold.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: Patch DetailScreen.kt
        run: |
          python3 - <<'PYEOF'
          import re
          p = "app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt"
          s = open(p, encoding="utf-8").read()

          # (a) label stays in place: plain Text instead of AnimatedContent
          start_marker = "            // Ver tudo and Ver menos trade places with the same 400 ms curve the\n"
          end_marker = "                    color = palette.accent,\n                )\n            }\n"
          a = s.index(start_marker)
          assert s.count(start_marker) == 1
          b = s.index(end_marker, a) + len(end_marker)
          block = s[a:b]
          assert "AnimatedContent(" in block and "slideInVertically(" in block and 'label = "show_all_label"' in block
          assert block.count("Text(") == 1
          new_block = (
              "            // Ver tudo and Ver menos share one spot; the label just changes in place.\n"
              "            Text(\n"
              "                text = showAllText ?: stringResource(R.string.show_all),\n"
              "                style = MaterialTheme.typography.titleSmall,\n"
              "                color = palette.accent,\n"
              "                modifier = Modifier\n"
              "                    .clickable(onClick = onShowAll)\n"
              "                    .padding(start = 12.dp, top = 4.dp, bottom = 4.dp),\n"
              "            )\n"
          )
          s = s[:a] + new_block + s[b:]

          # (b) songs list: tween without overshoot instead of springs
          spring_line = "animationSpec = spring(dampingRatio = Spring.DampingRatioLowBouncy, stiffness = Spring.StiffnessMedium),"
          assert s.count(spring_line) == 2
          s = s.replace(spring_line, "animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing),")

          # remove imports that are now unused, only when nothing else uses them
          def drop_import(name, token):
              global s
              imp = "import " + name + "\n"
              assert s.count(imp) == 1, name
              s = s.replace(imp, "")
              assert len(re.findall(r"\b" + token + r"\b", s)) == 0, token

          drop_import("androidx.compose.animation.slideInVertically", "slideInVertically")
          drop_import("androidx.compose.animation.slideOutVertically", "slideOutVertically")
          drop_import("androidx.compose.animation.SizeTransform", "SizeTransform")
          drop_import("androidx.compose.animation.core.Spring", "Spring")
          drop_import("androidx.compose.animation.core.spring", "spring")

          # things that must still be there
          for keep in ["fadeIn(animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing))",
                       "expandFrom = Alignment.Top", "shrinkTowards = Alignment.Top",
                       "import androidx.compose.animation.AnimatedContent\n", "import androidx.compose.animation.togetherWith\n",
                       "import androidx.compose.animation.core.tween\n", "import androidx.compose.animation.core.FastOutSlowInEasing\n"]:
              assert keep in s, keep
          open(p, "w", encoding="utf-8").write(s)
          print("patched")
          PYEOF
      - name: Commit patch
        run: |
          git config user.name "achiiilles"
          git config user.email "achiiilles@users.noreply.github.com"
          git add app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "Smooth fold without spring, keep Show all label in place [skip ci]"
          git push origin HEAD:library-artists-merge
