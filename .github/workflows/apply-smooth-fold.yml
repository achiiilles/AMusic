name: Apply smooth library songs fold patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: Patch DetailScreen only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt')
          s = p.read_text(encoding='utf-8')
          imp = 'import androidx.compose.animation.core.tween\n'
          assert s.count(imp) == 1, 'tween import changed'
          s = s.replace(imp, 'import androidx.compose.animation.core.FastOutSlowInEasing\n' + imp, 1)
          anchor = 'item(key = "library-songs-more")'
          assert s.count(anchor) == 1, 'fold item changed'
          before, after = s.split(anchor, 1)
          pattern = r'enter = fadeIn\(\) \+ expandVertically\(\),\s*exit = fadeOut\(\) \+ shrinkVertically\(\),'
          repl = '''enter = fadeIn(animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing)) +
                      expandVertically(
                          animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing),
                          expandFrom = Alignment.Top,
                      ),
                  exit = fadeOut(animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing)) +
                      shrinkVertically(
                          animationSpec = tween(durationMillis = 400, easing = FastOutSlowInEasing),
                          shrinkTowards = Alignment.Top,
                      ),'''
          after, n = re.subn(pattern, repl, after, count=1)
          assert n == 1, 'fold transition changed'
          p.write_text(before + anchor + after, encoding='utf-8')
          PY
          git diff --check
          git diff -- app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -- app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "Smooth library songs expansion from the top [skip ci]"
          git push origin HEAD:library-artists-merge
