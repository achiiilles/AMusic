name: Apply opaque grid patch
on:
  push:
    branches: [library-artists-merge]
    paths:
      - '.github/workflows/apply-opaque-grid.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: Give LibraryGridPage an opaque background
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/screens/LibraryScreen.kt')
          s = p.read_text(encoding='utf-8')
          old = 'BoxWithConstraints(modifier.fillMaxSize()) {'
          new = 'BoxWithConstraints(modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {'
          assert s.count(old) == 1, 'BoxWithConstraints line changed or not unique'
          assert s.index('fun LibraryGridPage(') < s.index(old), 'line is not inside LibraryGridPage'
          assert 'import androidx.compose.foundation.background' in s, 'background import missing'
          assert 'import androidx.compose.material3.MaterialTheme' in s, 'MaterialTheme import missing'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff --stat
          git diff
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -- sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/screens/LibraryScreen.kt
          git commit -m "Paint an opaque background on the Library Show all grid [skip ci]"
          git push origin HEAD:library-artists-merge
