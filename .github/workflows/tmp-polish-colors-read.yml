name: tmp-polish-colors-read
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/colors-trigger.txt']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: bash tmp-polish/colors-read.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tmp-polish/out-colors-*.txt
          git commit -m "tmp: saida leitura cores [skip ci]" || true
          git push origin HEAD:polish-refresh-transitions
