name: tmp lastfm diagnostic (no build)
on:
  workflow_dispatch:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - '.github/workflows/tmp-lastfm-diag.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run selection test against Last.fm and Apple
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SHOW_FLOOR: '0.1'
        run: python3 .github/tmp_lastfm_diag.py
