name: tmp-pally-album-footer
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-album-footer']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Aplicar somente o rodape do album
        run: |
          cp .pally/patch_album_footer.py /tmp/patch_album_footer.py
          python3 /tmp/patch_album_footer.py
