name: scan-once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan
        run: |
          set +e
          EX="--exclude-dir=.git --exclude=scan-report.txt --exclude=scan-once.yml"
          {
            echo "== path names with the old name =="
            find . -path ./.git -prune -o -iname '*bitchord*' -print | head -100
            echo "== files with the old name inside, total =="
            grep -rli $EX bitchord . | wc -l
            echo "== files with counts =="
            grep -rIic $EX bitchord . | grep -v ':0$' | head -200
            echo "== matching lines (text files) =="
            grep -rIin $EX bitchord . | cut -c1-200 | head -250
            echo "== binary files that match =="
            grep -rl $EX bitchord . | head -50
          } > scan-report.txt
          git config user.name "scan"
          git config user.email "scan@users.noreply.github.com"
          git add scan-report.txt
          git commit -m "temp: scan report [skip ci]"
          git push
