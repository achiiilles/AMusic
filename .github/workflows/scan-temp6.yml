name: scan-temp6
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/scan-temp6.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: scan
        run: |
          mkdir -p scan-out
          D=app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          P=shared/src/jvmSharedMain/kotlin/com/music/amusic/data/innertube/InnertubeParser.kt
          { echo '== Parser 317-430'; sed -n 317,430p $P; echo '== Detail 2075-2095'; sed -n 2075,2095p $D; echo '== sections grep'; grep -rnE 'sections *= |\.sections\b' --include=*.kt app/src/main shared/src/jvmSharedMain shared/src/commonMain | grep -v DetailScreen.kt | cut -c1-200 | head -40; } | cut -c1-200 > scan-out/s7.txt
      - name: push
        run: |
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -A
          git commit -m "scan report 5 [skip ci]" || exit 0
          git push origin HEAD:library-artists-merge
