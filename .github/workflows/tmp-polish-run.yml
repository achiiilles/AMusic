name: tmp-polish-run
on:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - tmp-polish/run-trigger.txt
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: executar
        run: bash tmp-polish/run.sh
      - name: gravar saida
        run: |
          git config user.name tmp-polish
          git config user.email tmp-polish@users.noreply.github.com
          git add -A tmp-polish app
          git commit -m "[skip ci] tmp: saida do script" || echo sem mudanca
          git pull --rebase origin polish-refresh-transitions || true
          git push origin HEAD:polish-refresh-transitions
