name: tmp-pally-album-about
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-album-about']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Aplicar somente as distancias e o MAIS da descricao do album
        run: |
          cp .pally/patch_album_about.py /tmp/patch_album_about.py
          python3 /tmp/patch_album_about.py
