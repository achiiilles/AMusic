name: tmp-polish-fx
on:
  push:
    paths:
      - 'tmp-polish/fx-run.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: python3 tmp-polish/fx-patch.py
      - run: |
          git config user.name "pally-tmp"
          git config user.email "pally-tmp@users.noreply.github.com"
          git add tmp-polish/out.txt app/src/main/java/com/music/amusic/MainActivity.kt app/src/main/java/com/music/amusic/ui/MainViewModel.kt
          git commit -m "fix: voltar do album reabre o Ver tudo no primeiro frame e remover da biblioteca troca na hora [skip ci]" || true
          git push origin HEAD:polish-refresh-transitions
