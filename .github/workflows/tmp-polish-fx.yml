name: tmp-polish-fx
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/fx-run.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: apply patch
        run: python3 tmp-polish/fx-patch.py
      - name: commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt app/src/main/java/com/music/amusic/ui/components/SongActionsSheet.kt app/src/main/java/com/music/amusic/ui/components/MiniPlayer.kt sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/screens/HomeScreen.kt
          git commit -m "feat(ui): transicoes estilo iOS (fade nas linhas, busca, rotulos, Recentes, mini player) [skip ci]"
          git pull --rebase origin polish-refresh-transitions || true
          git push origin HEAD:polish-refresh-transitions
