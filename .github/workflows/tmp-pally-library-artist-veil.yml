name: tmp-pally-library-artist-veil
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-library-artist-veil']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply patch
        run: python3 .pally/patch_library_artist_veil.py
      - name: Commit
        run: |
          git config user.name "pally-bot"
          git config user.email "pally-bot@users.noreply.github.com"
          git add app/src/main/java/com/music/amusic/MainActivity.kt
          git commit -m "Library artist page: back button and top pill wear the page colour [skip ci]"
          git push origin HEAD:polish-refresh-transitions
