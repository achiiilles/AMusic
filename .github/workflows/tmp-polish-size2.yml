name: tmp-polish-size2
on:
  push:
    branches: [polish-refresh-transitions]
    paths: [tmp-polish/size2-trigger.txt]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: python3 tmp-polish/size-apply.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/music/amusic/MainActivity.kt app/src/main/java/com/music/amusic/ui/components/FrostedTopBar.kt
          git diff --cached --check
          git diff --cached > tmp-polish/out-size-diff.txt
          git add tmp-polish/out-size-diff.txt
          git commit -m "Enlarge standalone account photo [skip ci]"
          git push
