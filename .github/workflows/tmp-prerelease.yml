# Temporario: so para rodar as checagens do pre-lancamento e ser removido no fim.
name: tmp-prerelease
on:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - '.github/scripts/tmp_prerelease_map.py'
      - '.github/workflows/tmp-prerelease.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Map the artist page
        run: python3 .github/scripts/tmp_prerelease_map.py
