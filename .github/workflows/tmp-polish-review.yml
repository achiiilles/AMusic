name: tmp-polish-review
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/run.txt']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: run script
        run: python3 tmp-polish/review-read.py
      - name: commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tmp-polish/out-*.txt
          git commit -m "tmp: resultado da leitura temporaria [skip ci]" || true
          git pull --rebase origin polish-refresh-transitions || true
          git push origin HEAD:polish-refresh-transitions
