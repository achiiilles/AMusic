name: tmp-polish-lsorder

on:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - 'tmp-polish/lsorder-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Apply patch and push
        run: |
          set +e
          python3 tmp-polish/lsorder-patch.py > tmp-polish/out-lsorder.txt 2>&1
          code=$?
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ $code -eq 0 ]; then
            git add shared/src/jvmSharedMain/kotlin/com/music/amusic/data/lyrics/LyricsSource.kt
            git commit -m "Ordem padrao das fontes de letra: BetterLyrics, PaxSenix, LyricsPlus primeiro [skip ci]"
            git show --stat HEAD >> tmp-polish/out-lsorder.txt
          fi
          git add tmp-polish/out-lsorder.txt
          git commit -m "tmp: resultado do patch da ordem das fontes [skip ci]"
          git pull --rebase origin polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
