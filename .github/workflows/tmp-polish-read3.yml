name: tmp-polish-read3
on:
  push:
    paths:
      - tmp-polish/run-trigger.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply small artist hero patch
        run: python3 tmp-polish/apply-hero.py
      - name: commit patch and readback
        run: |
          git config user.name tmp-polish
          git config user.email tmp-polish@users.noreply.github.com
          git add sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/screens/HomeScreen.kt tmp-polish/out-g.txt
          git commit -m 'feat: use Apple artist still in home hero card [skip ci]'
          git push
