name: Apply albums patch (temporary)

on:
  push:
    branches:
      - library-artists-merge
    paths:
      - '.github/workflows/apply-albums-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: Apply patch
        run: |
          python3 - <<'PYEND'
          import sys

          DETAIL = 'app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt'
          MAIN = 'app/src/main/java/com/music/amusic/MainActivity.kt'


          def swap(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  sys.exit('anchor %s found %d times' % (label, n))
              return text.replace(old, new)


          d = open(DETAIL, encoding='utf-8').read()
          m = open(MAIN, encoding='utf-8').read()
          if 'inLibraryArtistPage' in d or 'isLibraryArtistPage' in m:
              sys.exit('already patched')

          d = swap(d, '''    onLibraryArtistClick: (() -> Unit)? = null,
          ) {
          ''', '''    onLibraryArtistClick: (() -> Unit)? = null,
              /** True on the page the Na sua biblioteca heading opens: five songs first, then the albums row. */
              inLibraryArtistPage: Boolean = false,
          ) {
          ''', 'param')

          d = swap(d, '''    val queue = remember(matches) { matches.map { it.value } }
          ''', '''    val queue = remember(matches) { matches.map { it.value } }
              var songsExpanded by rememberSaveable(page.browseId) { mutableStateOf(false) }
              val previewSongs = inLibraryArtistPage && !songsExpanded && query.isBlank()
              val shownMatches = if (previewSongs) matches.take(5) else matches
          ''', 'state')

          d = swap(d, '''                    itemsIndexed(
                                  items = matches,
          ''', '''                    if (inLibraryArtistPage) {
                                  item(key = "library-songs-heading") {
                                      SectionHeading(
                                          title = stringResource(R.string.songs),
                                          palette = palette,
                                          onShowAll = if (previewSongs && matches.size > 5) {
                                              { songsExpanded = true }
                                          } else {
                                              null
                                          },
                                      )
                                  }
                              }
                              itemsIndexed(
                                  items = shownMatches,
          ''', 'songs')

          d = swap(d, '''                        if (position < matches.lastIndex) {
          ''', '''                        if (position < shownMatches.lastIndex) {
          ''', 'divider')

          d = swap(d, '''                    SectionHeading(
                                  title = shelf.title,
                                  palette = palette,
                                  onShowAll = if (canShowAll)''', '''                    SectionHeading(
                                  title = if (inLibraryArtistPage &&
                                      (shelf.title.trim().equals(hiddenFromLibraryTitle, ignoreCase = true) ||
                                          shelf.title.trim().equals("From your library", ignoreCase = true))
                                  ) {
                                      stringResource(R.string.albums)
                                  } else {
                                      shelf.title
                                  },
                                  palette = palette,
                                  onShowAll = if (canShowAll)''', 'albums-title')

          m = swap(m, '''                        val shownPage = if (libraryAlbumsShelf == null) {
          ''', '''                        val isLibraryArtistPage = remember(libraryState, page.browseId, page.type) {
                                      page.type != BrowseType.ARTIST &&
                                          (libraryState as? UiState.Success)?.data?.shelves
                                              ?.firstOrNull { it.title == "Artists" }
                                              ?.items
                                              ?.any { it.browseId != null && it.browseId == page.browseId } == true
                                  }
                                  val shownPage = if (libraryAlbumsShelf == null) {
          ''', 'main-flag')

          m = swap(m, '''                            page = shownPage,
          ''', '''                            page = shownPage,
                                      inLibraryArtistPage = isLibraryArtistPage,
          ''', 'main-arg')

          open(DETAIL, 'w', encoding='utf-8').write(d)
          open(MAIN, 'w', encoding='utf-8').write(m)
          print('patched ok')
          PYEND
      - name: Commit and push
        run: |
          git config user.name "Achillles"
          git config user.email "achillesh74@gmail.com"
          git add -A
          git commit -m "Library page: Albums row and five-song Musicas preview (skip ci)"
          git push origin HEAD:library-artists-merge
