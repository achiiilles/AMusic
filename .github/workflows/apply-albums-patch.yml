name: apply-albums-patch
on:
  push:
    branches: [library-artists-merge]
    paths: ['.github/workflows/apply-albums-patch.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-artists-merge
      - name: apply
        run: |
          python3 - <<'PY'
          import sys
          M = "app/src/main/java/com/music/amusic/MainActivity.kt"
          BLOCK = """val libraryAlbumsShelf = remember(libraryState, page.browseId, page.type) {
              val shelves = (libraryState as? UiState.Success)?.data?.shelves
              val artistName = if (page.type == BrowseType.ARTIST) {
                  null
              } else {
                  shelves
                      ?.firstOrNull { it.title == "Artists" }
                      ?.items
                      ?.firstOrNull { it.browseId == page.browseId }
                      ?.title
              }
              val albums = shelves
                  ?.firstOrNull { it.title == "Albums" }
                  ?.items
                  .orEmpty()
                  .filter { album ->
                      artistName != null &&
                          album.browseId != null &&
                          album.subtitle
                              .split(" • ", ",", "&")
                              .any { part -> isExactArtistMatch(part, artistName) }
                  }
              if (albums.isEmpty()) null else HomeShelf(title = "Álbuns na sua biblioteca", items = albums)
          }
          val shownPage = if (libraryAlbumsShelf == null) {
              page
          } else {
              page.copy(sections = page.sections + libraryAlbumsShelf)
          }"""
          src = open(M, encoding="utf-8").read()
          if "libraryAlbumsShelf" in src:
              sys.exit("already patched")
          lines = src.split("\n")
          hits = [i for i, l in enumerate(lines) if l.strip() == "DetailScreen(" and i + 2 < len(lines) and lines[i + 1].strip() == "page = page," and lines[i + 2].strip() == "libraryArtist = inLibraryArtist,"]
          if len(hits) != 1:
              sys.exit("anchor found %d times" % len(hits))
          i = hits[0]
          ind = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i + 1] = lines[i + 1].replace("page = page,", "page = shownPage,")
          new = [(ind + b) if b else b for b in BLOCK.split("\n")]
          lines[i:i] = new
          open(M, "w", encoding="utf-8").write("\n".join(lines))
          PY
          mkdir -p scan-out
          git diff > scan-out/patch.diff
          git config user.name 'Achillles'
          git config user.email 'achillesh74@gmail.com'
          git add -A
          git commit -m 'Library: show library albums row on the Ver tudo page of a library artist [skip ci]'
          git push origin HEAD:library-artists-merge
