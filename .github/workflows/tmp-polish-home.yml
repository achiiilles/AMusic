name: tmp polish home

on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/home-run.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Patch HomeScreen
        run: python3 tmp-polish/home-patch.py
      - name: Commit only HomeScreen.kt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sharedUi/src/jvmSharedMain/kotlin/com/music/amusic/ui/screens/HomeScreen.kt
          git commit -m 'Home: tira a nota musical acima de Ouvir agora [skip ci]'
          git push origin HEAD:polish-refresh-transitions
