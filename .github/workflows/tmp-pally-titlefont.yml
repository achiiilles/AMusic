name: tmp-pally-titlefont
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-titlefont']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Aplicar o ajuste
        run: python3 .pally/patch_titlefont.py
