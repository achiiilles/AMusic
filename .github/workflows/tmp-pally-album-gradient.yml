name: tmp-pally-album-gradient
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['.pally/trigger-album-gradient']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Aplicar somente o degrade e as cores do album
        run: |
          cp .pally/patch_album_gradient.py /tmp/patch_album_gradient.py
          python3 /tmp/patch_album_gradient.py
