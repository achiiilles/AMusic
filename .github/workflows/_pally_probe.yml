name: pally-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Apply anchored edits, no compilation
        run: |
          python3 .pally/apply_album_shelves.py
          git diff --stat
      - name: Commit the edited app files
        run: |
          git config user.name "pally"
          git config user.email "pally@users.noreply.github.com"
          git add shared/src/commonMain/kotlin/com/music/amusic/data/model/Models.kt shared/src/jvmSharedMain/kotlin/com/music/amusic/data/innertube/InnertubeParser.kt shared/src/jvmSharedMain/kotlin/com/music/amusic/data/YtMusicRepository.kt app/src/main/java/com/music/amusic/ui/MainViewModel.kt app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt app/src/main/java/com/music/amusic/MainActivity.kt app/src/main/java/com/music/amusic/data/canvas/AppleReleaseMatcher.kt app/src/main/java/com/music/amusic/data/canvas/AppleMusicCanvas.kt app/src/main/java/com/music/amusic/data/canvas/AppleAlbumShelves.kt
          git rm -q .pally/apply_album_shelves.py
          git commit -m "feat: Videoclipes e prateleiras do Apple Music na página do álbum [skip ci]"
          git pull --rebase origin polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
