name: pally-probe
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pally-notif-buttons
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Apply only anchored edits, no compilation
        run: |
          python3 .github/scripts/pally_notif_buttons.py
          git diff --check
          git status --short
      - name: Commit the reviewed app file
        run: |
          git config user.name "pally"
          git config user.email "pally@users.noreply.github.com"
          git rm -q -f .github/scripts/pally_notif_buttons.py
          git add app/src/main/java/com/music/amusic/playback/PlaybackService.kt
          git commit -m "feat: notificacao de midia usa AMusicNotificationProvider (botoes estilo Spotify) [skip ci]"
          git pull --rebase origin polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
