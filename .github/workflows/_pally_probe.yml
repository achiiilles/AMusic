name: pally probe

on:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - '.pally/**'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: run
        run: |
          set -euo pipefail
          bash .pally/run.sh
