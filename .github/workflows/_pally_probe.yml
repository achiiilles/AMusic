name: pally probe
on:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - '.pally/run.sh'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: run
        run: |
          set -uo pipefail
          bash .pally/run.sh > .pally/out.txt 2>&1 || true
          git config user.name 'pally'
          git config user.email 'pally@local'
          git add -f .pally
          git commit -m 'probe out' || true
          git push || true
