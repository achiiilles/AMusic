name: pally-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply the edits
        run: python3 .pally/apply_other_versions.py
      - name: Commit and push
        run: |
          git config user.name "pally"
          git config user.email "pally@users.noreply.github.com"
          git add shared/src/commonMain/kotlin/com/music/amusic/data/model/Models.kt shared/src/jvmSharedMain/kotlin/com/music/amusic/data/innertube/InnertubeParser.kt shared/src/jvmSharedMain/kotlin/com/music/amusic/data/YtMusicRepository.kt app/src/main/java/com/music/amusic/ui/MainViewModel.kt app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "feat: seção Outras versões na página de álbum [skip ci]"
          git pull --rebase origin polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
