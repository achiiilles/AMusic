name: tmp-polish-rec
on:
  push:
    branches: [polish-refresh-transitions]
    paths: ['tmp-polish/rec-trigger.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - run: bash tmp-polish/rec-read.sh
      - run: |
          git config user.name tmp
          git config user.email tmp@example.com
          git add tmp-polish/out-rec.txt
          git commit -m "tmp: out [skip ci]" || true
          git push origin HEAD:polish-refresh-transitions
