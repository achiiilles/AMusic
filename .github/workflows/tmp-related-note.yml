name: tmp-related-note

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'polish-refresh-transitions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
      - name: Apply script
        run: python3 .github/scripts/tmp_related_note.py .
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/amusic/data/canvas/AppleMusicCanvas.kt app/src/main/java/com/music/amusic/data/canvas/AppleAlbumShelves.kt app/src/main/java/com/music/amusic/ui/screens/DetailScreen.kt
          git commit -m "Mostra na tela o motivo de Talvez você goste não aparecer [skip ci]"
          git push origin HEAD:polish-refresh-transitions
