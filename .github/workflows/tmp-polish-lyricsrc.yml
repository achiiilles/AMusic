name: tmp-polish-lyricsrc

on:
  push:
    branches: [polish-refresh-transitions]
    paths:
      - 'tmp-polish/lyricsrc-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-refresh-transitions
          fetch-depth: 0
      - name: Apply patch and push
        run: |
          set +e
          python3 tmp-polish/lyricsrc-patch.py > tmp-polish/out-lyricsrc.txt 2>&1
          code=$?
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ $code -eq 0 ]; then
            git add app/src/main/java/com/music/amusic/data/settings/AppSettings.kt app/src/main/java/com/music/amusic/ui/MainViewModel.kt
            git commit -m "Lembrar a fonte de letra escolhida por musica [skip ci]"
            git show --stat HEAD >> tmp-polish/out-lyricsrc.txt
          fi
          git add tmp-polish/out-lyricsrc.txt
          git commit -m "tmp: resultado do patch de fonte de letra [skip ci]"
          git pull --rebase origin polish-refresh-transitions
          git push origin HEAD:polish-refresh-transitions
